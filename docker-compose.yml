  kafka:
    image: apache/kafka:3.7.0 # Sử dụng phiên bản ổn định, hỗ trợ KRaft hoàn toàn
    container_name: kafka-local
    ports:
      - "9092:9092"   # Cổng kết nối từ bên ngoài máy host (Spring Boot local)
      - "29092:29092" # Cổng kết nối nội bộ giữa các container trong docker
    environment:
      # Cấu hình Cluster ID cố định cho chế độ KRaft
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@localhost:29093'

      # Cấu hình địa chỉ lắng nghe (Listeners)
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093,EXTERNAL://0.0.0.0:29092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://localhost:9092,EXTERNAL://kafka:29092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'

      # Sửa lỗi INVALID_REPLICATION_FACTOR (Ép về 1 cho cụm Single Node)
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      # Cho phép tự động tạo topic khi gửi/nhận
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    volumes:
      # Lưu trữ dữ liệu data để không bị mất khi restart container
      - kafka_data:/var/lib/kafka/data

volumes:
  rabbitmq_data:
  postgres_data:
  kafka_data: