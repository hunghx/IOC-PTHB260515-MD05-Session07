spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://localhost:5432/mydatabase
    username: admin
    password: password123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: password123
  profiles:
    active: prod
  config:
    import: "optional:configserver:http://localhost:8888"
server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health, info, refresh